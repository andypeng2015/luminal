[package]
name = "gpt_oss"
version = "0.1.0"
edition = "2024"

[features]

[[bin]]
name = "gpt_oss"
path = "src/main.rs"

[[bin]]
name = "phase0_cast"
path = "src/bin/phase0_cast.rs"

[dependencies]
luminal = { path = "../.." }
luminal_nn = { path = "../../crates/luminal_nn" }
luminal_cuda_lite = { path = "../../crates/luminal_cuda_lite" }
tokenizers = "0.22.2"
rustc-hash = "2"

# HuggingFace model download
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"] }
safetensors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
half = { version = "2.7.1", features = ["bytemuck"] }
bytemuck = "1.24.0"
memmap2 = "0.9.9"
rand = "0.9.2"

[[bin]]
name = "dump_egglog"
path = "src/bin/dump_egglog.rs"

[lib]
name = "gpt_oss"
path = "src/lib.rs"
